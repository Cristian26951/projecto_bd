<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Tienda - Contacto</title>

    <!-- Fuente moderna -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- ===== BARRA DE NAVEGACIÓN (NAVBAR) ===== -->
    <header class="navbar">
      <div class="contenedor nav-contenido">
        <a class="logo"> Mi<strong>Tienda</strong></a>
        <nav class="nav-links">
          <a href="index.html">Inicio</a>
          <a href="index.html#productos">Productos</a>
          <a href="contacto.html">Contacto</a>
        </nav>
      </div>
    </header>

    <!-- ===== SECCIÓN DE CONTACTO ===== -->
    <main class="contenedor contacto-main">
      <section class="contacto-seccion">
        <h1>Contáctanos</h1>
        <p>Completa el formulario y nos pondremos en contacto contigo.</p>

        <form id="formularioContacto" class="formulario-contacto">
          <div class="grupo-formulario">
            <label for="nombre">Nombre</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              required
              placeholder="Tu nombre"
            />
          </div>

          <div class="grupo-formulario">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="tu@correo.com"
            />
          </div>

          <div class="grupo-formulario">
            <label for="telefono">Teléfono</label>
            <input
              type="tel"
              id="telefono"
              name="telefono"
              required
              placeholder="Número teléfonico"
            />
          </div>

          <div class="grupo-formulario">
            <label for="asunto">Asunto</label>
            <input
              type="text"
              id="asunto"
              name="asunto"
              required
              placeholder="Motivo de tu mensaje"
            />
          </div>

          <div class="grupo-formulario">
            <label for="mensaje">Mensaje</label>
            <textarea
              id="mensaje"
              name="mensaje"
              rows="5"
              required
              placeholder="Escribe tu mensaje aquí..."
            ></textarea>
          </div>

          <button type="submit" class="btn-enviar">Enviar Mensaje</button>
        </form>

        <input type="text" id="buscarContacto" placeholder="Buscar" />

        <div id="listaContactos"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="contenedor footer-contenido">
        <p>
          &copy; 2026 Mi Tienda — Proyecto Formativo con Node.js, Express y
          MySQL.
        </p>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
